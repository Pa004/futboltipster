name: CI

on:
  push:
  pull_request:

jobs:
  ml-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.lock
      - name: Lint (ruff check)
        run: python -m ruff check app tests scripts
      - name: Formato (ruff format)
        run: python -m ruff format --check .
      - name: Tests
        run: python -m pytest tests -q
      - name: Auditoría de dependencias (pip-audit)
        continue-on-error: true
        run: |
          pip install pip-audit
          python -m pip_audit -r requirements.lock

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Auditoría de dependencias (npm audit)
        continue-on-error: true
        run: npm audit --audit-level=high

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      # data/*.json es gitignored: seed mínimo solo para typecheck/lint.
      # parity/predict/routes requieren los JSON reales (export_to_json.py) y corren en local.
      - run: node scripts/seed-ci-data.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:ci
      - name: Auditoría de dependencias (npm audit)
        continue-on-error: true
        run: npm audit --audit-level=high

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Auditoría de dependencias (npm audit)
        continue-on-error: true
        run: npm audit --audit-level=high